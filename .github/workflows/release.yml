name: Release QFXMinimapTools
on:
  push:
    tags:
      - '[0-9]*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the GitHub release is already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,assets --jq 'select(.isDraft == false) | .assets[].name' 2>/dev/null | grep -qxF "QFXMinimapTools_${RELEASE_TAG}.zip"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build clean release archive
        if: steps.published.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_curseforge.py --addon-root QFXMinimapTools --project-id 1533519 --expected-version "$RELEASE_TAG"
      - name: Validate packaged Lua
        if: steps.published.outputs.exists != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          unzip -q dist/*.zip -d unpacked
          find unpacked -type f -name '*.lua' -print0 | xargs -0 -n 1 luac5.4 -p
      - name: Stage the release and record the CurseForge upload
        if: steps.published.outputs.exists != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CF_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft >/dev/null; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "QFXMinimapTools $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          release=$(gh release view "$RELEASE_TAG" --json isDraft,assets)
          jq -e '.isDraft' <<<"$release" >/dev/null
          assets=$(jq -r '.assets[] | select(.state == "uploaded") | .name' <<<"$release")
          archive="QFXMinimapTools_${RELEASE_TAG}.zip"
          receipt=curseforge-upload.json
          pending=curseforge-upload-pending.json
          if ! grep -qxF "$archive" <<<"$assets"; then
            gh release upload "$RELEASE_TAG" "dist/$archive"
          fi
          if grep -qxF "$receipt" <<<"$assets"; then
            gh release download "$RELEASE_TAG" --pattern "$receipt" --dir dist
          elif grep -qxF "$pending" <<<"$assets"; then
            echo "::error::A previous CurseForge upload has an unknown outcome. Check the prior run artifact and CurseForge before removing the pending marker or adding its receipt to the draft."
            exit 1
          else
            test -n "$CF_API_TOKEN"
            printf '{"runId":"%s","attempt":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "dist/$pending"
            gh release upload "$RELEASE_TAG" "dist/$pending"
            python3 scripts/publish_curseforge.py --addon-root QFXMinimapTools --project-id 1533519 --expected-version "$RELEASE_TAG" --game-version 12.1.5 --upload
            gh release upload "$RELEASE_TAG" "dist/$receipt"
          fi
          jq -e --arg version "$RELEASE_TAG" --arg archive "$archive" '
            .projectId == 1533519 and .version == $version and .filename == $archive
            and .gameVersion == "12.1.5" and (.fileId | type == "number" and . > 0)
          ' "dist/$receipt" >/dev/null
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -qxF "$pending" <<<"$assets"; then
            gh release delete-asset "$RELEASE_TAG" "$pending" --yes
          fi
      - name: Preserve archive and upload receipt
        if: always() && steps.published.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QFXMinimapTools-release-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/curseforge-upload.json
          if-no-files-found: ignore
      - name: Publish the GitHub release draft
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
